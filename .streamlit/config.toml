[server]
headless = true
maxUploadSize = 50
fileWatcherType = "none"
# Serve ./static publicly at /app/static/ (favicon.png, favicon.ico)
enableStaticServing = true

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"

# TEN Capital dark navy theme (tokens mirror ten_screener/ui.py)
[theme]
base = "dark"
primaryColor = "#EE5A4E"
backgroundColor = "#0B1526"
secondaryBackgroundColor = "#16283F"
textColor = "#F3F6FA"
linkColor = "#35BEBB"
borderColor = "#1E354F"
baseRadius = "12px"
buttonRadius = "12px"
showSidebarBorder = true
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
headingFont = "Sora:https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&display=swap"
codeFont = "JetBrains Mono:https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"

[theme.sidebar]
backgroundColor = "#101E33"
secondaryBackgroundColor = "#16283F"
